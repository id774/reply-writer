# Example Apache configuration. Replace the host and the certificate
# paths with those of the environment; nothing belonging to one is
# committed here.
#
# Enable proxy, proxy_http, headers and ssl before loading this virtual
# host.

<VirtualHost *:443>
    ServerName reply.example.net

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/reply.example.net.crt
    SSLCertificateKeyFile /etc/ssl/private/reply.example.net.key

    ProxyPreserveHost On
    # Above the gunicorn --timeout (240), which is above
    # GENERATION_TIMEOUT (120). Changing one means revisiting the others.
    ProxyTimeout 300

    # The application listens at its own root and is published under
    # /reply/. X-Forwarded-Prefix is what tells it so, and the
    # application builds its links and its form actions under that
    # prefix. Set the header here rather than letting a client send
    # one: it is set on every request, so a value from outside cannot
    # survive it.
    RequestHeader set X-Forwarded-Prefix "/reply"

    # Without the redirect, /reply does not match the ProxyPass below
    # and answers 404 while /reply/ works.
    RedirectMatch ^/reply$ /reply/

    ProxyPass        /reply/ http://127.0.0.1:8091/
    ProxyPassReverse /reply/ http://127.0.0.1:8091/

    # Private correspondence passes through this system, so it is not
    # published to anyone who finds the address. Pick one of these, or
    # use a VPN instead. Access control belongs here and not in the
    # application: no account system is introduced into it.
    # <Location /reply/>
    #     AuthType Basic
    #     AuthName "reply-writer"
    #     AuthUserFile /etc/apache2/reply.htpasswd
    #     Require valid-user
    # </Location>
    # <Location /reply/>
    #     Require ip 192.0.2.0/24
    # </Location>

    ErrorLog  ${APACHE_LOG_DIR}/reply-writer_error.log
    CustomLog ${APACHE_LOG_DIR}/reply-writer_access.log combined
</VirtualHost>
